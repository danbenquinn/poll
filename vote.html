<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MAE 2501 · Vote</title>
<style>
  :root{ --bg:#0b0c0e; --ink:#f2f2ef; --muted:#9aa0a6; --accent:#6cc6ff; --card:#16181c; --ok:#5ad46a; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--ink);
             font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-tap-highlight-color:transparent; }
  .wrap{ max-width:520px; margin:0 auto; padding:22px 18px 40px; min-height:100%; display:flex; flex-direction:column; }
  .kicker{ color:var(--accent); font-size:.72rem; letter-spacing:.16em; text-transform:uppercase; }
  h1{ font-size:1.25rem; line-height:1.35; margin:.5em 0 .2em; font-weight:650; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  .choice{ display:flex; align-items:center; gap:.7em; width:100%; text-align:left;
           background:var(--card); border:1.5px solid #2a2d33; border-radius:14px;
           padding:16px 16px; margin:0 0 12px; font-size:1.05rem; transition:border-color .15s, background .15s; }
  .choice .key{ flex:0 0 1.9em; height:1.9em; line-height:1.9em; text-align:center; border-radius:8px;
                background:#22252b; color:var(--muted); font-weight:650; }
  .choice.sel{ border-color:var(--accent); background:#12283a; }
  .choice.sel .key{ background:var(--accent); color:#04121d; }
  .choice[disabled]{ opacity:.55; }
  .status{ margin-top:8px; font-size:.95rem; color:var(--ok); min-height:1.4em; }
  .idbar{ margin-top:auto; padding-top:22px; color:var(--muted); font-size:.85rem; }
  .idbar a{ color:var(--accent); text-decoration:none; }
  .idscreen label{ display:block; margin:1.2em 0 .5em; color:var(--muted); }
  .idscreen input{ width:100%; padding:14px 14px; font-size:1.1rem; border-radius:12px;
                   border:1.5px solid #2a2d33; background:var(--card); color:var(--ink); }
  .idscreen .go{ width:100%; margin-top:16px; padding:15px; border-radius:12px; border:0;
                 background:var(--accent); color:#04121d; font-weight:700; font-size:1.05rem; }
  .hint{ color:var(--muted); font-size:.85rem; margin-top:.7em; line-height:1.4; }
  .err{ color:#ff9a9a; }
  .waiting{ margin:auto 0; text-align:center; color:var(--muted); }
  .waiting .dot{ display:inline-block; width:10px; height:10px; border-radius:50%; background:var(--accent);
                 margin:0 3px; animation:pulse 1.2s infinite ease-in-out; }
  .waiting .dot:nth-child(2){ animation-delay:.2s } .waiting .dot:nth-child(3){ animation-delay:.4s }
  @keyframes pulse{ 0%,100%{opacity:.25} 50%{opacity:1} }
  .hidden{ display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">MAE 2501 · Applied Physics I</div>

  <div id="idscreen" class="idscreen hidden">
    <h1>Before you vote</h1>
    <label for="cid">Your UVA Computing ID</label>
    <input id="cid" name="computing-id" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="e.g. abc1de" inputmode="text">
    <button class="go" id="idgo">Continue</button>
    <p class="hint">Used once to distribute prizes. Saved on this phone so you won't be asked again. It is not a password.</p>
    <p id="iderr" class="hint err"></p>
  </div>

  <div id="pollscreen" class="hidden">
    <h1 id="qtitle"></h1>
    <div id="choices"></div>
    <div id="status" class="status"></div>
    <div class="idbar">Voting as <b id="whoami"></b> · <a href="#" id="changeid">change</a></div>
  </div>

  <div id="waitscreen" class="hidden">
    <div class="waiting">
      <h1 id="waittitle">Waiting for the next question</h1>
      <p class="hint" id="waitbody">Keep this page open — it follows along with class.</p>
      <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>
    <div class="idbar">Voting as <b id="whoami2"></b> · <a href="#" id="changeid2">change</a></div>
  </div>

  <div id="msg" class="hidden"><h1 id="msgtitle"></h1><p id="msgbody" class="hint"></p></div>
</div>

<!-- Math. Same jsdelivr the supabase client below already comes from, and the same tex-svg
     output the deck uses (engine/mathjax-config.js), so the phone and the projector agree.
     `async` on purpose: if it never arrives the student sees raw $…$ and the buttons still work —
     the question is projected six feet tall behind them, and this page is a keypad. -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['$','$']], processEscapes: true },
    svg: { fontCache: 'none' },
    options: { skipHtmlTags: ['script','noscript','style','textarea','pre','code'], enableAssistiveMml: false },
    startup: { typeset: false }
  };
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  console.log("vote.html build v7 — question bank generated by build_vote_page.py; MathJax for equation choices");
  // ---- Supabase project (same values as in the deck) ----
  const SUPABASE_URL = "https://rdbacwwbeyeqdkswwvjt.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_IQNxMMynit0aWtOS3tjiRQ_h5sNo159";
  // --------------------------------------------------------

  // ==== POLLS · generated by slide-suite/tools/build_vote_page.py — do not hand-edit ====
  const POLLS = {
    "classA-q1": {
      q: "You measure a ball's motion from the front-left corner of this room; I measure it from the back-right corner. Both origins are <b>fixed</b>. Of position, velocity, and acceleration, which do we agree on?",
      choices: ["Position only", "None of them", "Velocity and acceleration, but not position", "All three"]
    },
    "classA-q2": {
      q: "A mass $m$ moves so that $\\underline{r}(t) = \\ell\\left\\langle \\cos\\omega t,\\; \\sin\\omega t\\right\\rangle$. What force is acting?",
      choices: ["$-m\\omega^2\\underline{r}$", "$+m\\omega^2\\underline{r}$", "$\\underline{0}$", "$-m\\underline{r}$"]
    },
    "classB-q1": {
      q: "A ball dropped from height $y_0$ takes time $\\tau$ to land. Now it's thrown <b>upward</b> from $y_0$ at speed $y_0/\\tau$. What is the new time to land, compared to $\\tau$?",
      choices: ["Longer", "Shorter", "The same", "Depends on $y_0$"]
    },
    "classB-q2": {
      q: "How much longer, in terms of $\\tau$? <i>(hint: $g=2y_0/\\tau^{2}$)</i>",
      choices: ["$1.5\\,\\tau$", "$\\tfrac{1+\\sqrt5}{2}\\,\\tau$", "$2\\,\\tau$", "$\\sqrt2\\,\\tau$"]
    },
    "classC-q1": {
      q: "Astronauts on the space shuttle feel about three times heavier during launch, i.e. they experience \"<b>3 g's</b>\". What is their upward acceleration?",
      choices: ["$9.8$ m/s²", "$19.6$ m/s²", "$29.4$ m/s²", "$3$ m/s²"]
    },
    "classC-q2": {
      q: "An astronaut's mass is $80$ kg. While experiencing those <b>3 g's</b>, what is the normal force from the seat on their body?",
      choices: ["$800$ N", "$1600$ N", "$2400$ N", "$3200$ N"]
    },
    "classC-q3": {
      q: "An elevator is broken and about to accelerate upward at 5 g's. Would it help to <b>jump</b> right before the elevator starts moving?",
      choices: ["Yes", "No"]
    },
    "classD-q1": {
      q: "Ball A is dropped from rest at the same instant Ball B is launched horizontally from the same height. What happens?",
      choices: ["Ball A lands first", "Ball B lands first", "They land together"]
    },
    "classD-q2": {
      q: "Two projectiles are launched at the <b>same speed</b>, one at $30^\\circ$ and one at $60^\\circ$. Which travels <b>farther</b>?",
      choices: ["The $30^\\circ$ shot", "The $60^\\circ$ shot", "They tie", "Depends on the speed"]
    },
    "classE-q1": {
      q: "In which case does a baseball probably experience the smallest magnitude of force?",
      choices: ["Ball is hit; home run", "Ball is bunted", "Ball hits the batter's leg", "Ball is caught by the catcher"]
    },
    "classE-q2": {
      q: "The world record speed for a baseball pitch is $105.8$ mph. A baseball's mass is about $0.145$ kg. Suppose it takes $\\approx 20$ ms for a catcher to stop the ball. About how much force would it require to catch a world record pitch?",
      choices: ["$340$ N", "$770$ N", "$3400$ N", "$7700$ N"]
    },
    "classF-q1": {
      q: "Consider a mass resting atop a vertical spring. All else equal, if you <b>double the mass</b>, the oscillation frequency…",
      choices: ["doubles", "drops by a factor of $\\sqrt{2}$", "is unchanged", "is cut to a quarter"]
    },
    "classF-q2": {
      q: "Consider a mass resting atop a vertical spring. All else equal, if you double the force of gravity...",
      choices: ["it oscillates faster", "it oscillates slower", "equilibrium drops; frequency unchanged", "it stops oscillating"]
    },
    "classG-q1": {
      q: "You drive the hanging spring <b>above</b> its resonant frequency. Compared with the push, the mass moves…",
      choices: ["in step with the push (in phase)", "opposite the push (out of phase)", "it doesn't move at all", "at exactly twice the push frequency"]
    },
    "classG-q2": {
      q: "You stiffen the spring (larger $k$), same mass. To hit resonance you must now drive it…",
      choices: ["at a higher frequency", "at a lower frequency", "at the same frequency as before", "you can't reach resonance anymore"]
    },
    "classH-q1": {
      q: "Consider the simulation of the ball bouncing off a vertical spring. As we slid $k$ toward $\\infty$, what happened to <b>contact time</b> and <b>peak force</b>?",
      choices: ["both increased", "both decreased", "contact time $\\to 0$, peak force $\\to \\infty$ (constant impulse)", "both stay the same"]
    },
    "classH-q2": {
      q: "The upward <b>normal force</b> from a solid floor is best understood as…",
      choices: ["a brand-new fundamental force, unrelated to springs", "the rigid limit of countless atomic push-only springs (electron-cloud repulsion)", "the same thing as friction", "gravity pointing the other way"]
    },
    "classI-q1": {
      q: "Two frictionless coaster cars start from rest at the <b>same height</b>. One goes down a steep hill; the other goes down a gentler hill; but they bottom out at the same height. At the bottom, which is faster?",
      choices: ["The one on the steeper track", "The one on the gentler track", "They arrive at the same speed", "Not enough information — need the track shapes"]
    },
    "classI-q2": {
      q: "A spring-loaded launcher fires a ball. If you compress the spring <b>twice as far</b>, the ball leaves…",
      choices: ["at the same speed", "twice as fast", "about $1.4\\times$ as fast", "four times as fast"]
    },
    "classJ-q1": {
      q: "Thrown <b>down</b> hard, \"sleeps\" at the bottom of the string, then yanked back <b>up</b>. Which graph fits? (blue = $K$ · red = $U_\\text{grav}$ · green = $U_\\text{elastic}$)",
      choices: ["flat lid throughout", "lid climbs, no trading", "flat lid, green spike at the bottom", "lid up, then down, then up"]
    },
    "classJ-q2": {
      q: "Thrown forward, <b>one full revolution</b> on a taut string, then caught. Which graph fits?",
      choices: ["the same graph as the sleeper", "one clean cycle, flat lid", "lid up, flat, then down", "green and blue, one cycle"]
    },
    "classJ-q3": {
      q: "The clip you have been watching since you walked in: thrown <b>horizontally</b> on its elastic cord, it falls, hits the ground about when the cord is fully stretched, bounces, and is hauled back. Which graph fits?",
      choices: ["red into blue, and it stays there", "broad green hump, sharp spike at the floor", "blue and green only, no red", "green grows and never returns"]
    },
    "classJ-q4": {
      q: "Same ball, same cord (stiffness $k$, slack length $\\ell$), now thrown <b>straight up</b> from its anchor and caught back at the same height. Which graph fits?",
      choices: ["no green at any point", "green spike at the apex only", "green the whole way up and down", "green only past the slack length"]
    },
    "classK-q1": {
      q: "A skydiver has reached terminal speed and is still falling. On their energy graph, which is happening?",
      choices: ["Blue is flat, red drains, amber grows at the same rate red drains", "Blue grows, red drains, amber is flat", "Blue is flat, red is flat, amber grows", "All three are flat — nothing is changing"]
    },
    "classK-q2": {
      q: "A whiffle ball: $m=20$ g, diameter $7.5$ cm, $C_d\\approx0.5$, in air at $\\rho=1.2$ kg/m$^3$. Its terminal speed is about…",
      choices: ["$4$ m/s", "$12$ m/s", "$25$ m/s", "$40$ m/s"]
    },
    "classL-q1": {
      q: "You are adjusting a door closer. You want the door to reach the frame <b>as quickly as possible</b> without ever swinging past it. You should set the damping to…",
      choices: ["$\\zeta$ a little below 1", "$\\zeta=1$", "$\\zeta$ as large as you can make it", "$\\zeta=0$"]
    },
    "classL-q2": {
      q: "A mass $m=2$ kg sits on a spring with $k=200$ N/m and a damper with $\\alpha=20$ kg/s. Which is it?",
      choices: ["$\\zeta=0.5$ — underdamped", "$\\zeta=0.5$ — overdamped", "$\\zeta=2$ — overdamped", "$\\zeta=1$ — critically damped"]
    },
    "classM-q1": {
      q: "You walk across a level floor without slipping. The friction force that pushes you forward is…",
      choices: ["static friction", "kinetic friction", "static while the foot lands, kinetic while it pushes off", "neither — friction only ever slows things down"]
    },
    "classM-q2": {
      q: "A $4$ kg block slides $5$ m down a $30^\\circ$ ramp at <b>constant speed</b>. How much energy ends up as heat?",
      choices: ["$98$ J", "$0$ J — the speed never changes, so nothing is lost", "$170$ J", "You cannot say without knowing $\\mu_k$"]
    }
  };
  // ==== /POLLS ====

  const $ = id => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const CLASS = params.get("class");
  const configured = !SUPABASE_URL.includes("YOUR-PROJECT");
  let supa = null;   // created below, only once we know the library actually loaded

  let state = { poll: null, open: false };   // pushed from the deck via get_state
  let shownKey = null;                        // what's currently rendered (poll|open)

  function show(el){ ["idscreen","pollscreen","waitscreen","msg"].forEach(i=>$(i).classList.add("hidden")); $(el).classList.remove("hidden"); }
  function message(t,b){ $("msgtitle").textContent=t; $("msgbody").textContent=b; show("msg"); }
  function getId(){ return (localStorage.getItem("uva_computing_id")||"").trim(); }
  function setWho(){ $("whoami").textContent=getId(); $("whoami2").textContent=getId(); }

  function start(){
    setWho();
    if(!getId()){ show("idscreen"); $("cid").focus(); return; }
    beginPolling();
  }

  $("idgo").addEventListener("click", () => {
    const v = $("cid").value.trim().toLowerCase();
    if(!/^[a-z]{2,4}[0-9]{0,4}[a-z]?$/i.test(v) || v.length < 3){
      $("iderr").textContent = "Please enter a valid UVA Computing ID (e.g. abc1de)."; return;
    }
    localStorage.setItem("uva_computing_id", v); setWho(); beginPolling();
  });
  function changeId(e){ e.preventDefault(); shownKey=null; show("idscreen"); $("cid").value=getId(); $("cid").focus(); }
  $("changeid").addEventListener("click", changeId);
  $("changeid2").addEventListener("click", changeId);

  let polling = false;
  function beginPolling(){
    reconcile();                       // show a screen IMMEDIATELY (no blank gap while the first poll loads)
    if(polling) return;
    polling = true; poll(); setInterval(poll, 2500);
  }

  async function poll(){
    try{
      const { data, error } = await supa.rpc("get_state", { p_class: CLASS });
      if(error) throw error;
      const row = (data && data[0]) || null;
      state = row ? { poll: row.current_poll, open: !!row.is_open } : { poll: null, open: false };
    }catch(e){ console.warn(e); }
    reconcile();
  }

  function reconcile(){
    if(!getId()) return;                       // still on id screen
    if(!$("idscreen").classList.contains("hidden")) return;   // user is changing their ID — don't yank it away
    const key = (state.poll || "-") + "|" + state.open;
    if(key === shownKey) return;               // nothing changed
    shownKey = key;
    if(state.poll && POLLS[state.poll]) renderQuestion(state.poll, state.open);
    else showWait("Waiting for the next question", "Keep this page open — it follows along with class.");
  }

  // MathJax is loaded `async`, so the FIRST question routinely renders before the library exists —
  // and since `shownKey` stops a question re-rendering, a typeset that is merely skipped is a
  // question that stays raw TeX for as long as it is on screen. Caught in testing exactly that way:
  // Class A's Q2 (the only all-equation choice set in the course) came up as backslashes while the
  // later questions typeset fine. So this WAITS for MathJax rather than checking for it.
  //
  // `window.MathJax` is the config object from the head and exists immediately; `startup.promise`
  // only appears once the library itself lands, which is the thing worth waiting on. If it never
  // lands we give up after 15 s and the student reads raw $…$ — survivable, because the question is
  // projected six feet tall behind them and this page is a keypad.
  let mjReady = null;
  function whenMathJax(){
    if(mjReady) return mjReady;
    mjReady = new Promise(done => {
      const tick = setInterval(() => {
        if(window.MathJax && window.MathJax.startup && window.MathJax.startup.promise){
          clearInterval(tick); clearTimeout(giveUp);
          window.MathJax.startup.promise.then(done, done);
        }
      }, 100);
      const giveUp = setTimeout(() => { clearInterval(tick); console.warn("MathJax never loaded"); done(); }, 15000);
    });
    return mjReady;
  }
  function typeset(els){
    whenMathJax().then(() => {
      try{ window.MathJax.typesetPromise(els).catch(e => console.warn(e)); }catch(e){ console.warn(e); }
    });
  }

  function showWait(t,b){ $("waittitle").textContent=t; $("waitbody").textContent=b; show("waitscreen"); }

  function renderQuestion(pid, open){
    show("pollscreen");
    const poll = POLLS[pid];
    $("qtitle").innerHTML = poll.q;
    const prev = localStorage.getItem("voted_"+pid);
    const box = $("choices"); box.innerHTML = "";
    poll.choices.forEach((txt,i) => {
      const b = document.createElement("button");
      b.className = "choice" + (String(i)===prev ? " sel" : "");
      if(!open) b.setAttribute("disabled","");
      b.innerHTML = `<span class="key">${"ABCD"[i]}</span><span>${txt}</span>`;   // txt is escaped by the generator
      b.addEventListener("click", () => submit(pid, i));
      box.appendChild(b);
    });
    $("status").textContent = !open ? "Voting closed for this question." :
                              (prev!==null ? "Recorded. Tap another to change it (until voting closes)." : "");
    typeset([$("qtitle"), box]);
  }

  async function submit(pid, i){
    if(!state.open || state.poll !== pid) return;
    [...document.querySelectorAll(".choice")].forEach((c,j)=>c.classList.toggle("sel", j===i));
    $("status").textContent = "Sending…";
    try{
      const { error } = await supa.rpc("cast_vote", { p_poll: pid, p_id: getId(), p_choice: i });
      if(error) throw error;
      localStorage.setItem("voted_"+pid, i);
      $("status").textContent = "Vote recorded ✓  You can change it until voting closes.";
    }catch(e){
      $("status").innerHTML = '<span class="err">Could not send — check your connection and tap again.</span>';
      console.warn(e);
    }
  }

  // ---- Kick things off LAST, so every function + variable above is already initialized ----
  if(!CLASS){ message("Missing class", "This link is incomplete. Scan the code shown on the current slide."); }
  else if(!configured){ message("Not configured", "The voting backend isn't set up yet."); }
  else if(!window.supabase){ message("Couldn't load", "A network hiccup stopped the voter from loading. Check your connection and reload this page."); }
  else { supa = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY); start(); }
</script>
</body>
</html>
